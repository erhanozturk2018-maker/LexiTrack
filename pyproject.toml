[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexitrack"
version = "0.2.0"
description = "LexiTrack — Vocabulary Learning & Review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erhan" }]
keywords = ["vocabulary", "pdf", "language-learning", "desktop", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24.3",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
]

[project.scripts]
lexitrack = "lexitrack.main:main"

[project.gui-scripts]
lexitrack-gui = "lexitrack.main:main"

[tool.setuptools.packages.find]
include = ["lexitrack*"]

[tool.setuptools.package-data]
lexitrack = ["database/*.sql", "ui/theme/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
